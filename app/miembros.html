<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
</head>
<body>
    <style>

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            justify-content: center;
        }
        .cont-miembros{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .Card{
            display: flex;
            align-items: center;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin: 15px;
            max-width: 42%;
            width: 200px;
            padding: 10px;
            justify-content: flex-end;
            justify-content: space-between;
            cursor: pointer;
            /**/
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(4px);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), 
                box-shadow 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), 
                border-color 0.4s ease;
        }
        .Card:hover {
            border-color: #ffffff; 

            border-color: rgba(255, 255, 255, 0.4); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 
                0 0 15px 2px rgba(255, 255, 255, 0.12);
                
            transform: translateY(-6px);
        }
        .Card>div{
        }
        .Card>div>img{
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            
        }
        .nombre{
            font-size: 1.1em;
            letter-spacing: 2px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); 
            transition: color 0.3s ease;
        }
        .Card:hover .nombre {
            color: #00ffff; 
        }
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .Card {
                /*width: calc(50% - 20px); */
                margin: 10px; 
                box-sizing: border-box; 
                /*max-width: none; */
            }

            .nombre {
                font-size: 1em; 
            }
        }
    </style>

    <div class="cont-miembros">
        <div class="Card" onclick="VerPerfil('doga')">
            <div>
                <img src="img/doga.png" alt="doga.png">
            </div>

        </div>
        <div class="Card" onclick="VerPerfil('jaimeros')">

        <div class="Card" onclick="VerPerfil('luizhito')">

        </div>
        <div class="Card" onclick="VerPerfil('mamawebos')">

        <div class="Card" onclick="VerPerfil('kamikaze')">

            <div>

        </div>
        <div class="Card" onclick="VerPerfil('shikuso')">

            </div>
            <div>
                <span class="nombre">SHIKUSO</span>
            </div>
        </div>
        <div class="Card" onclick="VerPerfil('simiolo')">

            </div>
            <div>
                <span class="nombre">SIMIOLO</span>
            </div>
        </div>
    </div>

        console.log(view2)

            /*destino.scrollIntoView({

        }  
        function VerPerfil(nombre) {

        };
    </script>
    
</body>
</html>
