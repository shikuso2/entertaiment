        /* --- ESTILOS BASE (ESCRITORIO) --- */
        body {
            margin: 0;
            font-family: sans-serif;
        }
        /*mini menu*/
        .minimenu{
            border-top: 1px solid white;
            padding-top: 15px;
            padding-left: 12px;
        }

        /* Por defecto, ocultamos el menú móvil en pantallas grandes */
        .mobile-navbar {
            display: none; 
        }

        .layout-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            background-image: url('pok.png'); 
            background-repeat: no-repeat;            
            background-position: center bottom;
            background-size: contain;
        }
        .sidebar h1{
            text-align: center;
        }
        .sidebar>ul{
            padding: 15px;
        }
        .cat-li{
            padding: 8px;
            list-style-type: none;
            text-transform: uppercase;
        }
        .sidebar .subcat-li{
            padding: 8px;
            /*list-style-type: none;*/
            text-transform: uppercase;
        }
        .vinculo{
            cursor: pointer;
        }
        .vinculo:hover{
            background-color: #2d2d2d;
        }

        .main-content {
            /*padding: 20px;*/
            background-color: #f5f5f5;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }


        /* --- ADAPTACIÓN PARA MÓVILES (Pantallas menores a 768px) --- */
        @media (max-width: 768px) {
        
            .layout-container {
                /* Cambiamos a 1 sola columna y agregamos una fila superior para el menú móvil */
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr; 
                height: 100vh;
            }

            /* Ocultamos por completo el menú lateral izquierdo */
            .sidebar {
                display: none;
            }

            /* Mostramos el menú superior */
            .mobile-navbar {
                display: flex;
                align-items: center;
                background-color: #1a1a1a;
                color: white;
                padding: 15px;
                box-sizing: border-box;
            }
            .mobile-navbar>details {
                width: 100%;
            }
            .mobile-navbar>details>summary {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0px 15px;
            }
            .mobile-navbar>details>summary>span{
                font-size: 1.3em;
                font-weight: 600; /* Letra un poco más gruesa */
                letter-spacing: 2px;
            }
            
            /* El contenido derecho ahora ocupa todo el ancho, pero mantiene su scroll */
            .main-content {
                overflow-y: auto;
            }
        }

    <script>
        //const queryParams = window.location.search;
        const urlParams = new URLSearchParams(window.location.search);
        const contenedor = document.getElementById('sidemenu');
        const view = urlParams.get('view');
        const perfil = urlParams.get('perfil');
        console.log(view)
        
        if (view && view.trim() !== "") { 
            if (perfil) {
                cargarweb(view + "?perfil=" + perfil); 
            } else {
                
                cargarweb(view); 
            }
        } else { 
            cargarweb("miembros"); 
        }        
        
        function cargarweb(direccion){
            switch(direccion) {
                case "miembros":
                    contenedor.style.backgroundImage = "url('mem.png')";
                    break;
                case "pokemon1": 
                    contenedor.style.backgroundImage = "url('pok.png')";
                    break;
                default:
                    contenedor.style.backgroundImage = "url('pok.png')"; 
                    break;
            }          
            const miIframe = document.getElementById("pagina");
            if (direccion.includes("?")) {
                const partes = direccion.split("?");
                miIframe.src = partes[0] + ".html?" + partes[1]+ '&v=' + new Date().getTime(); 
            } else {
                miIframe.src = direccion + ".html"+ '?v=' + new Date().getTime();
            }            
            const elDetails = document.getElementById('det-minimenu');
            elDetails.removeAttribute('open');
        } 
        const opciones = [
            { color: 'tb1', probabilidad: 60 },
            { color: 'tb2', probabilidad: 27 },
            { color: 'tb3', probabilidad: 10 },
            { color: 'tb4', probabilidad: 3 }
        ];
        function ColorRandom() {
            const numeroAzar = Math.random() * 100;  
            let sumaAcumulada = 0;
            for (let i = 0; i < opciones.length; i++) {
                sumaAcumulada += opciones[i].probabilidad;                
                if (numeroAzar <= sumaAcumulada) {
                    return i;
                    break;
                }
            }
        }
        document.getElementById('shikuso').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('doga').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('jaimeros').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('simiolo').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('kamikaze').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('luizhito').classList.add(opciones[ColorRandom()].color); 
        document.getElementById('mamawebos').classList.add(opciones[ColorRandom()].color); 

        function abrirModal(nombre) {
            const myModal = document.getElementById('simplemodal');            
            if (myModal.checkVisibility()) {
                myModal.style.display = 'none';                  
                const elementos = document.getElementsByClassName('usermodal');
                for (let i = 0; i < elementos.length; i++) {
                    elementos[i].style.display = 'none';
                }             
            }else{
                myModal.style.display = 'flex';
                const User = document.getElementById(nombre);
                User.style.display = 'block';                 
            }            
        }
              
    </script>
