<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="shortcut icon" href="../Imgs/mini.png" type="image/x-icon">
    <title>ShikuPedia</title>
</head>
<body>
    
    <div class="layout-container">
        <header class="mobile-navbar">
            <div class="logo">ShikuPedia</div>
            <button class="menu-toggle">☰</button>
        </header>
        <aside class="sidebar">
            <h1>ShikuPedia</h1>
            <ul>
                <li class="cat-li vinculo" onclick="cargarweb('miembros')">Miembros</li>
                <li class="cat-li">Pokemon</li>
                <ul>
                    <li onclick="cargarweb('pokemon1')" class="vinculo subcat-li">Season 1</li>
                </ul>
                <li class="cat-li">Minecraft</li>
                <li class="cat-li">Empire Earth</li>
            </ul>
        </aside>

        <iframe id="pagina" class="main-content" src="" frameborder="0" allowfullscreen>
            
        </iframe>
    
    </div>
    <style>
        /* --- ESTILOS BASE (ESCRITORIO) --- */
        body {
            margin: 0;
            font-family: sans-serif;
        }

        /* Por defecto, ocultamos el menú móvil en pantallas grandes */
        .mobile-navbar {
            display: none; 
        }

        .layout-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            background-image: url('pok.png'); 
            background-repeat: no-repeat;            
            background-position: center bottom;
            background-size: contain;
        }
        .sidebar h1{
            text-align: center;
        }
        .sidebar>ul{
            padding: 15px;
        }
        .sidebar .cat-li{
            padding: 8px;
            list-style-type: none;
            text-transform: uppercase;
        }
        .sidebar .subcat-li{
            padding: 8px;
            /*list-style-type: none;*/
            text-transform: uppercase;
        }
        .vinculo{
            cursor: pointer;
        }
        .vinculo:hover{
            background-color: #2d2d2d;
        }

        .main-content {
            /*padding: 20px;*/
            background-color: #f5f5f5;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }


        /* --- ADAPTACIÓN PARA MÓVILES (Pantallas menores a 768px) --- */
        @media (max-width: 768px) {
        
            .layout-container {
                /* Cambiamos a 1 sola columna y agregamos una fila superior para el menú móvil */
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr; 
                height: 100vh;
            }

            /* Ocultamos por completo el menú lateral izquierdo */
            .sidebar {
                display: none;
            }

            /* Mostramos el menú superior */
            .mobile-navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #1a1a1a;
                color: white;
                padding: 15px;
                height: 60px; /* Altura fija para el menú superior */
                box-sizing: border-box;
            }
            
            /* El contenido derecho ahora ocupa todo el ancho, pero mantiene su scroll */
            .main-content {
                overflow-y: auto;
            }
        }
    </style>

    <script>
        //const queryParams = window.location.search;
        const urlParams = new URLSearchParams(window.location.search);
        const view = urlParams.get('view');
        const perfil = urlParams.get('perfil');
        console.log(view)
        if (view && view.trim() !== "") { 
            if (perfil) {
                cargarweb(view + "?perfil=" + perfil); // Inyecta: "miembros?perfil=Luizhito"
            } else {
                cargarweb(view); 
            }
        } else { 
            cargarweb("miembros"); 
        }
        function cargarweb(direccion){
            const miIframe = document.getElementById("pagina");
            if (direccion.includes("?")) {
                const partes = direccion.split("?");
                miIframe.src = partes[0] + ".html?" + partes[1]; // Construye: miembros.html?perfil=Luizhito
            } else {
                miIframe.src = direccion + ".html";
            }
        } 
              
    </script>
    
</body>
</html>
